services:
  postgres:
    image: postgres:18-alpine
    container_name: signaldesk-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signaldesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signaldesk}
      POSTGRES_DB: ${POSTGRES_DB:-signaldesk}
    volumes:
      - signaldesk-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signaldesk-postgres:
