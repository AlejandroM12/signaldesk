packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@newrelic/fn-inspect": true
  "@newrelic/native-metrics": false
  "@parcel/watcher": true
  "@prisma/engines": true
  prisma: true
  protobufjs: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@testing-library/user-event@14.6.8'
